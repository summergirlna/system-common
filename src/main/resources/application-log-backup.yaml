system-common:
  log-backup:
    archive-root-directory: "${SYSTEM_COMMON_LOG_ARCHIVE_DIR:log_arc}"
    compress-after-days: "${SYSTEM_COMMON_LOG_COMPRESS_AFTER_DAYS:5}"
    delete-after-days: "${SYSTEM_COMMON_LOG_DELETE_AFTER_DAYS:31}"
    targets:
      - product-name: "application"
        source-path: "${SYSTEM_COMMON_LOG_DIR:logs}/system-common.log"
  audit-log-backup:
    archive-root-directory: "${SYSTEM_COMMON_AUDIT_LOG_ARCHIVE_DIR:audit_log_arc}"
    compress-after-days: "${SYSTEM_COMMON_AUDIT_LOG_COMPRESS_AFTER_DAYS:31}"
    delete-after-days: "${SYSTEM_COMMON_AUDIT_LOG_DELETE_AFTER_DAYS:366}"
    targets:
      - product-name: "audit"
        source-path: "${SYSTEM_COMMON_AUDIT_LOG_DIR:logs}/system-common-audit.log"